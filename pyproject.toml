[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bibtex-fetch"
dynamic = ["version"]
description = "Fetch original source BibTeX with a live HTTP process console. No AI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bibtex", "bibliography", "crossref", "arxiv", "dblp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "bibtexparser==1.4.3",
  "pylatexenc==2.10",
  "defusedxml>=0.7.1,<1",
]

[project.urls]
Homepage = "https://github.com/ylwhxht/bibtex-fetch"
Repository = "https://github.com/ylwhxht/bibtex-fetch"
Documentation = "https://github.com/ylwhxht/bibtex-fetch/blob/main/docs/USAGE.md"
Issues = "https://github.com/ylwhxht/bibtex-fetch/issues"

[project.scripts]
bibtex-fetch = "bibclean.launcher:main"
bibtex-fetch-cli = "bibclean.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.version]
path = "bibclean/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bibclean"]

[tool.hatch.build.targets.sdist]
only-include = [
  "bibclean", "tests", "examples", "docs", "scripts", ".github",
  "pyproject.toml", "uv.lock", "requirements.txt", "run.py", "start.bat",
  "README.md", "README.en.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md",
  "SECURITY.md", ".gitignore", ".gitattributes", ".editorconfig",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
